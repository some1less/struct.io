name: Sonar

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true

jobs:
  analyze:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT: some1less_struct.io
      SONAR_ORGANIZATION: some1less
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend coverage (vitest)
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run test:coverage
      - name: Install scanner
        run: |
          dotnet tool install --global dotnet-sonarscanner --version 11.3.0
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Begin analysis
        run: |
          dotnet sonarscanner begin /k:"$SONAR_PROJECT" /o:"$SONAR_ORGANIZATION" \
            /d:sonar.host.url=https://sonarcloud.io /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml" \
            /d:sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info \
            /d:sonar.exclusions="**/Migrations/**,frontend/src/data/**,scripts/**" \
            /d:sonar.coverage.exclusions="frontend/e2e/**,**/*.config.ts,**/*.config.js" \
            /d:sonar.qualitygate.wait=true
      - name: Build
        run: dotnet build Struct.sln
      - name: Test with coverage (xUnit, coverlet)
        run: >
          dotnet test Struct.sln --no-build --results-directory TestResults --collect:"XPlat Code Coverage"
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
      - name: End analysis
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
