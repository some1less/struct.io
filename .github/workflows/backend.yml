name: Backend

on:
  workflow_call:

jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build
        id: build
        run: dotnet build Struct.sln
      - name: Test
        id: test
        run: dotnet test Struct.sln --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - name: Summary
        if: always()
        run: |
          python3 .github/scripts/ci_summary.py steps "Backend" \
            "Build=${{ steps.build.outcome }}" "xUnit=${{ steps.test.outcome }}"
          python3 .github/scripts/ci_summary.py tests "Backend tests (xUnit)" "TestResults/*.trx"
