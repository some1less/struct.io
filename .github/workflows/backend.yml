name: Backend

on:
  workflow_call:

jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build
        run: dotnet build Struct.sln
      - name: Test
        run: dotnet test Struct.sln --no-build
