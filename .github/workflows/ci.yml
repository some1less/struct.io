name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    uses: ./.github/workflows/secrets.yml

  backend:
    name: Backend
    uses: ./.github/workflows/backend.yml

  frontend:
    name: Frontend
    uses: ./.github/workflows/frontend.yml

  scraper:
    name: Scraper
    uses: ./.github/workflows/scraper.yml

  # Informational until the rules are calibrated, so it is not part of CI result.
  sonar:
    name: Sonar
    uses: ./.github/workflows/sonar.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  e2e:
    name: E2E
    needs: [backend, frontend]
    uses: ./.github/workflows/e2e.yml

  result:
    name: CI result
    if: always()
    needs: [secrets, backend, frontend, scraper, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any stage did not pass
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
