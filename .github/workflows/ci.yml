name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    uses: ./.github/workflows/secrets.yml

  backend:
    name: Backend
    uses: ./.github/workflows/backend.yml

  frontend:
    name: Frontend
    uses: ./.github/workflows/frontend.yml

  # Informational until the rules are calibrated, so it is not part of CI result.
  sonar:
    name: Sonar
    uses: ./.github/workflows/sonar.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  e2e:
    name: E2E
    needs: [backend, frontend]
    uses: ./.github/workflows/e2e.yml

  result:
    name: CI result
    if: always()
    needs: [secrets, backend, frontend, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Summary
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci_summary.py result
