name: Secret scan

on:
  workflow_call:

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full history
        run: |
          docker run --rm -v "$PWD":/repo "$GITLEAKS_IMAGE" git /repo --redact --no-banner -v \
            --report-format json --report-path /repo/gitleaks.json 2>&1 | tee gitleaks.log
      - name: Summary
        if: always()
        run: python3 .github/scripts/ci_summary.py gitleaks gitleaks.log gitleaks.json "$GITLEAKS_IMAGE"
